<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizApp</title>
    <link rel="stylesheet" href="style.css">
    <!-- BOOTSTRAP FILE-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="shortcut icon" href="./assets/icons/favicon.svg" type="image/x-icon">
</head>
<body onload="init()">
    <nav class="navbar bg-body-tertiary">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">QuizApp</span>
        </div>
    </nav>

    <div class="container">
        <div class="card quiz-card">
            <img src="./assets/img/quiz.png" id="headerImage" class="card-img-top">

            <div class="progress" role="progressbar" aria-label="Example with label" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100">
                <div class="progress-bar" id="progressBar" style="width: 0%">25%</div>
            </div>

            <div class="card-body" id="endscreen" style="display: none;">
                <div class="textCenter">
                    Quiz beendet!
                </div>
                <div class="textCenter">
                    Du hast insgesamgt <b id="counterRightAnswer"></b> Fragen von <b id="counterQuestion"></b> richtig beantwortet.
                </div>
                <div class="btnRow">
                    <button class="btn btn-primary" onclick="restartGame()">Erneut spielen</button>
                </div>
            </div>

            <div class="card-body" id="questionBody">
                <h5 class="card-title" id="questionsText"></h5>
                
                <div class="card quizAnswerCard mb-2" onclick="answer('answer1')">
                    <div class="card-body" id="answer1">
                        Antwort
                    </div>
                </div>

                <div class="card quizAnswerCard mb-2" onclick="answer('answer2')">
                    <div class="card-body" id="answer2">
                        Antwort
                    </div>
                </div>

                <div class="card quizAnswerCard mb-2" onclick="answer('answer3')">
                    <div class="card-body" id="answer3">
                        Antwort
                    </div>
                </div>

                <div class="card quizAnswerCard mb-2" onclick="answer('answer4')">
                    <div class="card-body" id="answer4">
                        Antwort
                    </div>
                </div>

                <div class="question-footer">
                    <span>
                        <b id="position"></b> von <b id="allQuestions"></b> Fragen
                    </span>
                    <button class="btn btn-dark" id="nextBtn" disabled onclick="nextQuestion()">Nächste Frage</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
    <!--BOOTSTRAP FILE-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
